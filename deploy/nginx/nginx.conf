server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Security headers (spec §82).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /healthz { proxy_pass http://server:8080; }
  location /readyz  { proxy_pass http://server:8080; }

  # The /assets SPA page shares a name with Vite's static assets directory.
  # Serve the page explicitly; /assets/*.js and *.css still use the normal path.
  location = /assets {
    try_files /index.html =404;
  }
  location = /assets/ {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
