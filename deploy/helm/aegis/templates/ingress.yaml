{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aegis.fullname" . }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls: [ { hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tls.secretName }} } ]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "aegis.fullname" . }}-frontend, port: { number: 80 } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: {{ include "aegis.fullname" . }}-server, port: { number: 8080 } } }
{{- end }}
