name: Aegis Release Build

# Packages release artifacts and attaches them to the GitHub release that
# semantic-release published. Mirrors FlameInTheDark/emerald's split:
# semantic-release.yml owns versioning, this workflow owns artifacts.
on:
  release:
    types:
      - published
  repository_dispatch:
    types:
      - semantic-release-published
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}

    steps:
      - name: Resolve release context
        id: resolve
        shell: bash
        run: |
          TAG_NAME=""
          PRERELEASE="false"

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            PRERELEASE="${{ github.event.release.prerelease }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG_NAME="${{ github.event.client_payload.tag_name }}"
            PRERELEASE="${{ github.event.client_payload.prerelease }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          fi

          if [ -z "$TAG_NAME" ]; then
            echo "Release tag could not be determined." >&2
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  source-archives:
    name: Package source archives
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # Runs the packaging gates itself: CGO_ENABLED=0 go build ./...,
      # go vet ./..., npm ci (when needed), web build (tsc -b && vite build).
      # A tree that does not build can never be released.
      - name: Package release archives
        run: bash scripts/package-release.sh "${{ needs.prepare.outputs.tag_name }}"

      - name: Upload archives to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          files: |
            download/aegis-v*.tar.gz
            download/aegis-v*.zip
            download/aegis-v*.sha256
          overwrite_files: true

  container:
    name: Build and push container
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aegis
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag_name }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease != 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
