name: Release

# Semantic-release on every push to main: analyzes conventional commits,
# cuts the next version (vX.Y.Z tag), updates CHANGELOG.md and attaches the
# packaged source archives to the GitHub release. Nothing is published when
# no commit qualifies (feat/fix/…).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # credentials must persist: @semantic-release/git pushes the
          # CHANGELOG.md release commit back to main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # scripts/package-release.sh (the @semantic-release/exec prepareCmd)
      # gates on go build/vet + the web build, so the runner needs Go
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: require v* tags
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            echo "::error::No v* tags on this repo - push tags (git push origin --tags) so semantic-release can anchor the next version."
            exit 1
          fi
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # changelog/exec/git are not bundled with semantic-release and the
        # repo has no root package.json, so install them into the same npx
        # prefix via -p flags - otherwise plugin resolution dies with
        # MODULE_NOT_FOUND before any commit is analyzed
        run: npx --yes -p semantic-release@24 -p @semantic-release/changelog@6 -p @semantic-release/exec@6 -p @semantic-release/git@10 semantic-release
