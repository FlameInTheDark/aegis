name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache: true }
      - name: gofmt check
        run: test -z "$(gofmt -l cmd internal api 2>/dev/null)" || { gofmt -l cmd internal api; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      # The race detector is the point of `make test`; CI must differ from
      # the developer gate ONLY by -short, never by dropping -race.
      - name: test
        run: go test ./... -short -race

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      # Unit tests (Vitest) gate every pull request: a typecheck-clean
      # build can still ship a broken page.
      - run: npm test
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-it
          POSTGRES_DB: aegis_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AEGIS_TEST_PG_URL: postgres://aegis:aegis-it@127.0.0.1:5432/aegis_it?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache: true }
      # The tests that skip without AEGIS_TEST_PG_URL cover tenancy,
      # asset merge, scan recovery and settings — the exact regression
      # classes 1.32.x kept fixing. They run here, not as skips.
      - name: integration tests
        run: go test ./internal/repository/postgres/ -count=1

  migration-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every up migration has a down
        run: |
          fail=0
          for up in migrations/postgres/*.up.sql; do
            down="${up%.up.sql}.down.sql"
            [[ -f "$down" ]] || { echo "missing $down"; fail=1; }
          done
          exit $fail

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache: true }
      # Installed explicitly so the Makefile's "not installed (skipped)"
      # fallback never triggers on the runner.
      - uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout 5m

  docker:
    needs: [backend, frontend, postgres-integration, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.server
          push: false

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: lint commit messages (conventional commits)
        run: |
          npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19
          npx commitlint --from "origin/${{ github.base_ref }}" --to "$GITHUB_SHA"
