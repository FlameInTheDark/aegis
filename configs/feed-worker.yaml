# ==============================================================================
# Aegis Security Platform — feed-worker configuration reference
# ==============================================================================
#
# The feed-worker synchronizes external vulnerability intelligence into the
# CVE store. It runs OUTSIDE user request paths; sync jobs are
# sequential per feed with retry/backoff, full bookkeeping in feed_sync_runs
# and provenance for every ingested field. See docs/VULNERABILITY-FEEDS.md
# for sources, licensing and outage semantics.
#
# Precedence: environment variables ALWAYS override this file.
# ==============================================================================

env: production                    # AEGIS_ENV
log:
  level: info                      # AEGIS_LOG_LEVEL
  format: json                     # AEGIS_LOG_FORMAT

metrics:
  addr: ":9091"                    # AEGIS_METRICS_ADDR

# --- Data layer ------------------------------------------------------------------
database_url: postgres://aegis:aegis@localhost:5432/aegis?sslmode=require   # DATABASE_URL
redis_url: redis://localhost:6379/0                                        # REDIS_URL
s3:
  endpoint: http://localhost:9000   # S3_ENDPOINT — raw feed payloads are archived
  bucket: aegis                     # S3_BUCKET    to S3; vulnerabilities.raw_ref
  access_key: ""                    # S3_ACCESS_KEY (secret) points at the object
  secret_key: ""                    # S3_SECRET_KEY (secret)
  use_ssl: false                    # S3_USE_SSL

# --- Feeds --------------------------------------------------------------------------
feeds:
  # Enabled sources (comma list). Any subset of: nvd,kev,epss,osv,vulnrichment,cve
  enabled: nvd,kev,epss,osv,vulnrichment   # AEGIS_FEEDS_ENABLED
  # Interval between incremental syncs. Bootstrap (full) sync happens on first
  # run per feed; NVD's full sync is large — budget disk and time for it.
  interval: 6h                             # AEGIS_FEEDS_INTERVAL

  # Per-feed overrides (optional). Endpoint URLs are FIXED by default — the
 # feed-worker never fetches user-supplied URLs (SSRF hardening).
  # Overriding an endpoint is an administrative action; treat the value as
  # code review-worthy.
  sources:
    nvd:
      # NVD API 2.0 (https://services.nvd.nist.gov/rest/json/cves/2.0)
      api_key: ""              # NVD_API_KEY (secret) — raises the rate limit
    kev:
      # CISA Known Exploited Vulnerabilities catalog JSON
      url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    epss:
      # FIRST EPSS daily scores
      url: https://api.first.org/data/v1/epss
    osv:
      # OSV.dev (Google) — batch query API + GCS export
      url: https://api.osv.dev/v1/query
    vulnrichment:
      # CISA Vulnrichment — enriches CVEs with CVSS/CWE/KEV decision points
      url: https://www.cisa.gov/sites/default/files/feeds/vulnrichment/vulnrichment.json

demo_mode: false                   # AEGIS_DEMO_MODE
