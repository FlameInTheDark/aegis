syntax = "proto3";

package aegis.connector.v1;

option go_package = "github.com/FlameInTheDark/aegis/api/gen/aegis/connector/v1;connectorv1";

// ConnectorService is the UNIFIED enrollment and control protocol for every
// externally connected component of the platform: endpoint agents, remote
// scanners, external collectors, and future component kinds.
//
// All kinds share the same connection protocol and differ only in the role
// logic that runs on top of the distributed configuration:
//
//       1. An operator creates the connection in the UI and receives a
//          one-time connect command:
//              aegis-connector --connect <host>:<port>/<enroll_token>
//       2. The component dials gRPC and calls Enroll with that token. If the
//          backend accepts it, the connector record is marked active, the token
//          is burned (further init attempts with the same token are rejected)
//          and the allow message is returned: a long-lived connector secret,
//          the canonical connection endpoint info and the current configuration.
//       3. The component persists the credentials to a local config file
//          (optionally installs itself as a system service) and starts work.
//       4. On every (re)connect the component calls GetConfig to reload its
//          configuration, keeps a WatchConfig stream open for hot reload
//          without restarts, and heartbeats liveness + role status.
//
// Continued-run authentication uses per-call metadata:
//
//      x-aegis-connector-id:     <connector_id>
//      x-aegis-connector-secret: <secret issued at enrollment>
//
// Transport is gRPC; TLS when the platform endpoint terminates TLS,
// plaintext is accepted only for local development.
service ConnectorService {
  // Enroll exchanges the one-time connect token for a long-lived connector
  // secret plus endpoint/config info. The token is single-use: a second
  // call with the same token is rejected.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // GetConfig returns the connector's current configuration. Called by the
  // component on every connection so config changes take effect on
  // reconnect even without a live watch stream.
  rpc GetConfig(GetConfigRequest) returns (ConnectorConfig);
  // WatchConfig streams configuration updates for hot reload. The first
  // update carries the current configuration; every later update is pushed
  // when the configuration is changed from the UI/API.
  rpc WatchConfig(WatchConfigRequest) returns (stream ConfigUpdate);
  // Heartbeat reports liveness and role status. The response carries the
  // server's current config version so the component can re-fetch when it
  // missed a watch update (belt-and-braces with WatchConfig).
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // GetSelf returns the connector's own record as the server sees it
  // (used by `aegis-connector status`).
  rpc GetSelf(GetSelfRequest) returns (ConnectorSelf);
  // BindDevice attaches (or refreshes) the device identity of an
  // agent-kind connector: the endpoint generates a CSR locally — the
  // private key never leaves — and the server creates or updates the
  // bound device record and returns its certificate. Authenticated with
  // connector credentials; rejected for every other kind. This replaces
  // the old standalone agent enrollment (removed in v1.24.0).
  rpc BindDevice(BindDeviceRequest) returns (BindDeviceResponse);
}

message EnrollRequest {
  string token = 1;            // one-time enrollment token from the UI
  string expected_kind = 2;    // client-declared kind; must match the record
  string hostname = 3;
  string platform = 4;         // windows | linux | darwin
  string arch = 5;
  string version = 6;          // connector binary version
  repeated string capabilities = 7; // role-reported capabilities
}

message EnrollResponse {
  string connector_id = 1;
  string secret = 2;           // long-lived credential; stored client-side only
  string grpc_endpoint = 3;    // canonical endpoint info for continued runs
  bool tls = 4;                // whether to use TLS for continued connections
  ConnectorConfig config = 5;  // initial configuration snapshot
  int32 heartbeat_interval_secs = 6;
  string name = 7;
  string kind = 8;
}

message GetConfigRequest {}

message ConnectorConfig {
  int64 version = 1;           // monotonic, bumped on every UI/API change
  string settings_json = 2;    // free-form role configuration (bounded)
  int32 heartbeat_interval_secs = 3;
}

message WatchConfigRequest { int64 known_version = 1; }

message ConfigUpdate {
  int64 version = 1;
  string settings_json = 2;
  int32 heartbeat_interval_secs = 3;
  bool snapshot = 4;           // true for the initial current-state update
}

message HeartbeatRequest {
  string version = 1;          // connector binary version
  uint64 uptime_secs = 2;
  string status_json = 3;      // role status snapshot (bounded to 16 KiB)
  string state = 4;            // running | shutting_down (graceful-stop marker)
}

message HeartbeatResponse {
  string server_time = 1;
  int64 config_version = 2;    // drift detector for missed watch updates
}

message GetSelfRequest {}

message ConnectorSelf {
  string connector_id = 1;
  string name = 2;
  string kind = 3;
  string status = 4;           // pending | active | revoked
  string hostname = 5;
  string platform = 6;
  string arch = 7;
  string version = 8;
  int64 config_version = 9;
  string last_seen = 10;       // RFC3339, empty when never seen
  string organization_id = 11;
}

message BindDeviceRequest {
  string csr_pem = 1;          // CSR generated on the endpoint (public key only)
  string hostname = 2;
  string platform = 3;         // windows | linux | darwin
  string platform_version = 4;
  string arch = 5;
  string agent_version = 6;
  string machine_id = 7;       // stable local identifier
}

message BindDeviceResponse {
  string agent_id = 1;
  string certificate_pem = 2;  // device certificate signed by platform CA
  string org_id = 3;
  string site_id = 4;
  int32 heartbeat_interval_secs = 5;
}
